<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Voting System</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            min-height: 100vh;
        }
        .card {
            border-radius: 15px;
        }
        .vote-option {
            cursor: pointer;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <!-- Card -->
            <div class="card shadow-lg p-4">

                <div class="card-body">
                    <h3 class="card-title text-center mb-4">
                        🗳️ Online Voting System
                    </h3>

                    <p class="text-muted text-center mb-4">
                        Please select one option and submit your vote
                    </p>

                    <!-- Voting Form -->
                    <form method="post">
                        {% csrf_token %}

                        <div class="form-check mb-3 vote-option">
                            <input class="form-check-input" type="radio" name="choice" value="Option A" id="optionA" required>
                            <label class="form-check-label" for="optionA">
                                Option A
                            </label>
                        </div>

                        <div class="form-check mb-3 vote-option">
                            <input class="form-check-input" type="radio" name="choice" value="Option B" id="optionB">
                            <label class="form-check-label" for="optionB">
                                Option B
                            </label>
                        </div>

                        <div class="form-check mb-4 vote-option">
                            <input class="form-check-input" type="radio" name="choice" value="Option C" id="optionC">
                            <label class="form-check-label" for="optionC">
                                Option C
                            </label>
                        </div>

              <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                Submit Vote
                            </button>
                        </div>
                    </form>

                    <hr class="my-4">

<hr class="my-4">

<h5 class="text-center mb-3">
    Live Results (Total Votes: {{ total }})
</h5>

<div class="mb-3">
    <label>Option A — {{ count_a }} votes</label>
    <div class="progress">
        <div class="progress-bar bg-success" style="width: {{ percent_a }}%">
            {{ percent_a }}%
        </div>
    </div>
</div>

<div class="mb-3">
    <label>Option B — {{ count_b }} votes</label>
    <div class="progress">
        <div class="progress-bar bg-warning" style="width: {{ percent_b }}%">
            {{ percent_b }}%
        </div>
    </div>
</div>

<div class="mb-3">
    <label>Option C — {{ count_c }} votes</label>
    <div class="progress">
        <div class="progress-bar bg-danger" style="width: {{ percent_c }}%">
            {{ percent_c }}%
        </div>
    </div>
</div>
                    <!-- Results -->
                    <!-- End Card -->

            <p class="text-center text-white mt-3 small">
                Powered by Django · Hosted on Azure VM
            </p>

        </div>
    </div>
</div>

</body>
</html>
